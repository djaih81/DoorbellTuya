name: Session lifecycle tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge-src/go.mod
          cache-dependency-path: bridge-src/go.sum
      - run: go test -race -timeout=60s ./...
        working-directory: bridge-src
      - run: go vet ./...
        working-directory: bridge-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
